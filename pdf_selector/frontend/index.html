<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PDF Selector</title>
  <style>
    :root {
      --bg: #f5f5f5;
      --fg: #222;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --muted: #6b7280;
    }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100%;
    }

    /* ─────────  Sticky toolbar  ───────── */
    #toolbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    #toolbar button {
      padding: 6px 14px;
      border: 1px solid #d1d5db;
      background: white;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.1s;
    }
    #toolbar button:hover:not(:disabled) { background: #f3f4f6; }
    #toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
    #page-label {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      min-width: 64px;
      text-align: center;
    }
    /* The prominent "+ Add" button — always visible, label changes by state */
    #add-btn {
      background: var(--accent) !important;
      color: white !important;
      border: none !important;
      font-weight: 600;
      padding: 7px 16px !important;
      margin-left: auto;
    }
    #add-btn:hover:not(:disabled) { background: var(--accent-hover) !important; }
    #add-btn:disabled { background: #9ca3af !important; opacity: 0.7; cursor: default; }
    #status-text {
      flex-basis: 100%;
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding-top: 4px;
    }
    #status-text b { color: var(--fg); }

    /* ─────────  Scrollable page container  ───────── */
    #pages-wrap {
      height: calc(100vh - 86px);   /* fill space below toolbar */
      overflow-y: auto;
      overflow-x: auto;
      padding: 8px 0 24px 0;
    }
    #pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .pdf-page {
      position: relative;
      background: white;
      flex: 0 0 auto;
      box-shadow: 0 2px 12px rgba(0,0,0,0.15);
    }

    /* ─────────  Text layer (PDF.js v4 TextLayer compatible) ───────── */
    .text-layer {
      position: absolute;
      left: 0;
      top: 0;
      overflow: hidden;
      line-height: 1;
      text-align: initial;
      forced-color-adjust: none;
      user-select: text;
      -webkit-user-select: text;
      pointer-events: auto;
      cursor: text;
      transform-origin: 0% 0%;
    }
    /* PDF.js sets per-span position, font-family, font-size, and
       transform: scaleX(...) inline.  We must NOT override transform
       or transform-origin here — that's what makes the invisible
       selection bounds match the visible canvas-rendered text width. */
    .text-layer span,
    .text-layer br {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }
    .text-layer ::selection {
      background: rgba(37, 99, 235, 0.30);
      color: transparent;
    }
    .text-layer ::-moz-selection {
      background: rgba(37, 99, 235, 0.30);
      color: transparent;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="page-prev" title="Previous page">←</button>
    <span id="page-label">– / –</span>
    <button id="page-next" title="Next page">→</button>
    <button id="add-btn" disabled>➕ Add selected text as reference</button>
    <div id="status-text">Tip: drag-select an unhighlighted reference in the PDF, then click the button.</div>
  </div>
  <div id="pages-wrap">
    <div id="pages">Loading PDF…</div>
  </div>

  <script src="./streamlit-component-lib.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
